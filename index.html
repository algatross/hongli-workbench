<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F1A">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="description" content="红利买点工作台 · 看股息率、算买点价、盯分红公告。行情实时抓，数据存本机。">
<!-- 与 PWA 相关：本地双击打开时这几个文件不存在，浏览器会静默忽略，不影响使用 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="红利买点">
<title>红利买点工作台</title>
<style>
:root{
  --bg:#0A0F1A; --panel:#121A2B; --panel2:#18243A; --line:#22304C;
  --tx:#E8EEF8; --tx2:#8FA3C0; --tx3:#5C7093;
  --acc:#22D3EE; --gold:#FBBF24; --up:#F5474B; --down:#0FA968;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.5; padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--tx2)}

header.hd{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:10px;
  padding:12px 14px; background:rgba(10,15,26,.92);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
}
.hd-main{flex:1;min-width:0}
.hd-title{font-size:16px;font-weight:600;letter-spacing:.5px}
.hd-sub{font-size:11px;color:var(--tx2);margin-top:2px;line-height:1.5}
.hd-sub b{color:var(--acc);font-weight:600;font-variant-numeric:tabular-nums}
.hd-src{font-size:10px;color:#4E6285;margin-top:1px;line-height:1.45;overflow-wrap:anywhere}

/* 数据源卡片 */
.src-row{display:flex;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.src-row:last-child{border-bottom:none;padding-bottom:0}
.src-row:first-child{padding-top:0}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;margin-top:5px;background:#64748B}
.dot.ok{background:#22D3A0;box-shadow:0 0 6px rgba(34,211,160,.55)}
.dot.old{background:var(--gold);box-shadow:0 0 6px rgba(251,191,36,.5)}
.dot.off{background:#64748B}
.src-body{flex:1;min-width:0}
.src-name{font-size:12.5px;color:var(--tx);font-weight:600}
.src-name span{font-weight:400;color:var(--tx3);font-size:11px;margin-left:5px}
.src-url{
  font-size:10px;color:#54A6C4;word-break:break-all;margin-top:3px;line-height:1.5;
  font-family:ui-monospace,Consolas,"Courier New",monospace;
  background:#0C1421;border:1px solid #1B2A42;border-radius:5px;padding:3px 5px;
}
.src-meta{font-size:11px;color:var(--tx3);margin-top:4px;line-height:1.65}
.src-meta b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.src-meta i{color:var(--acc);font-style:normal;font-variant-numeric:tabular-nums}

/* 行业页：横向页签 */
.indtabs{
  display:flex;gap:7px;overflow-x:auto;padding:2px 0 9px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.indtabs::-webkit-scrollbar{display:none}
.indtab{
  flex:0 0 auto;font-size:12px;padding:6px 12px;border-radius:16px;
  background:var(--panel);border:1px solid var(--line);color:var(--tx2);
  white-space:nowrap;cursor:pointer;line-height:1.4;
}
.indtab.on{background:rgba(34,211,238,.13);border-color:var(--acc);color:var(--acc);font-weight:600}
.indtab .n{opacity:.62;font-size:11px;margin-left:3px}

/* 行业总览行 */
.indrow{
  display:flex;align-items:center;gap:8px;padding:9px 0;
  border-bottom:1px dashed var(--line);cursor:pointer;
}
.indrow:last-child{border-bottom:none}
.indrow:active{opacity:.7}
.indrow .inm{font-size:12.5px;color:var(--tx);flex:0 0 62px}
.indrow .ibar{flex:1;height:6px;border-radius:3px;background:#16233A;overflow:hidden;min-width:0}
.indrow .ibar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#1E7F8C,#22D3EE)}
.indrow .ival{font-size:12px;color:var(--tx);width:42px;text-align:right;font-variant-numeric:tabular-nums}
.indrow .icnt{font-size:11px;color:var(--tx3);width:30px;text-align:right;font-variant-numeric:tabular-nums}

/* 行业水位条 */
.wstat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.wstat div{background:#0E1727;border:1px solid var(--line);border-radius:9px;padding:8px 4px}
.wstat b{display:block;font-size:15px;color:var(--tx);font-variant-numeric:tabular-nums;line-height:1.3}
.wstat span{font-size:10px;color:var(--tx3);line-height:1.5}
button{
  font-family:inherit;font-size:13px;color:var(--tx);background:var(--panel2);
  border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;
}
button:active{transform:scale(.97)}
button.primary{background:var(--acc);color:#04121A;border-color:var(--acc);font-weight:600}
button.ghost{background:transparent}
button.mini{padding:4px 9px;font-size:12px;border-radius:7px}

.banner{
  margin:10px 14px 0;padding:9px 12px;border-radius:10px;font-size:12px;
  background:#1B1503;border:1px solid #4A3A08;color:#FBBF24;line-height:1.5;
}
.banner.warn{background:#1B0909;border-color:#4A1212;color:#F09595}
.banner.info{background:#081C2A;border-color:#12405A;color:#7FC8EE;cursor:pointer}
.banner.hide{display:none}

main{padding:12px 0 20px}
.view{display:none;padding:0 14px}
.view.on{display:block}

/* 买点卡片 */
.stk{
  background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:12px 13px;margin-bottom:9px;
}
.stk.hot{border-color:#5A4A10;background:linear-gradient(180deg,#1B1708,#121A2B 62%)}
.stk.hit{border-color:#123F4A;background:linear-gradient(180deg,#08202A,#121A2B 62%)}
.stk-top{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.nm{font-size:15px;font-weight:600}
.cd{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.tag{font-size:10px;padding:1px 6px;border-radius:5px;background:#1B2740;color:var(--tx2);border:1px solid #24344F}
.tag.a{color:#97C459;border-color:#2A3A1B;background:#141C0C}
.tag.hk{color:#85B7EB;border-color:#1B2E44;background:#0C1622}
.sec{margin-left:auto;font-size:11px;color:var(--tx3)}
.rk{
  font-size:10px;color:var(--acc);background:rgba(34,211,238,.1);
  border:1px solid rgba(34,211,238,.25);border-radius:4px;padding:0 4px;
  line-height:15px;font-variant-numeric:tabular-nums;
}
.stk-mid{display:flex;align-items:flex-end;gap:14px;margin-top:9px}
.px{font-size:20px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.chg{font-size:11px;margin-left:5px;font-variant-numeric:tabular-nums}
.yld{margin-left:auto;text-align:right}
.yld-v{font-size:20px;font-weight:600;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1.1}
.yld-l{font-size:10px;color:var(--tx3);margin-top:2px}
.stk-bot{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pill{font-size:11px;padding:4px 9px;border-radius:7px;background:#0E1727;border:1px solid var(--line);color:var(--tx2)}
.pill b{color:var(--tx);font-weight:600}
.pill.gold{background:#1E1805;border-color:#4A3A08;color:var(--gold)}
.pill.acc{background:#08202A;border-color:#123F4A;color:var(--acc)}
.pill.go{cursor:pointer;border-color:#1E3A4A;color:var(--acc);background:#0B1B24}
.pill.go:active{background:#123040}
.gobtn{
  font-size:10.5px;line-height:1;padding:4px 7px;border-radius:6px;cursor:pointer;
  border:1px solid #1E3A4A;color:var(--acc);background:#0B1B24;white-space:nowrap;
}
.gobtn:active{background:#123040}

/* 布林轨道尺（卡片内联） */
.bb{margin-top:11px;padding-top:9px;border-top:1px solid #19233A}
.bb-hd{display:flex;align-items:baseline;gap:6px;margin-bottom:7px;flex-wrap:wrap}
.bb-tag{font-size:10.5px;line-height:15px;padding:0 6px;border-radius:5px;border:1px solid var(--line);white-space:nowrap}
.bb-dist{margin-left:auto;font-size:10.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.bb-dist b{font-weight:600}
.bb-brk-lo{background:#04222B;color:#38DEE8;border-color:#124A55}
.bb-lo{background:#08202A;color:#7FC8EE;border-color:#123F4A}
.bb-dn{background:#0E1727;color:#8AA0BE;border-color:var(--line)}
.bb-mid{background:#0E1727;color:var(--tx2);border-color:var(--line)}
.bb-up{background:#0E1727;color:#8AA0BE;border-color:var(--line)}
.bb-hi{background:#1E1805;color:#E5B94A;border-color:#4A3A08}
.bb-brk-hi{background:#231A03;color:var(--gold);border-color:#5A4A10}
.bb-flat{background:#141C2A;color:#6B7D99;border-color:#1A2439}
.bb-track{
  position:relative;height:6px;border-radius:3px;
  background:linear-gradient(90deg,#1B6E7E 0%,rgba(34,211,238,.24) 26%,rgba(110,128,155,.22) 50%,rgba(251,191,36,.28) 74%,#7A5E12 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
}
.bb-tk{position:absolute;top:-3px;width:1px;height:12px;background:rgba(255,255,255,.13)}
.bb-tk.mid{background:rgba(255,255,255,.26)}
.bb-pt{
  position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;
  background:#F2F6FF;z-index:2;
  box-shadow:0 0 0 2px #0A0F1A, 0 0 0 3px rgba(170,190,215,.32), 0 0 10px 2px rgba(200,220,245,.45);
}
.bb-pt.lo{
  background:#38DEE8;
  box-shadow:0 0 0 2px #0A0F1A, 0 0 0 3px rgba(34,211,238,.55), 0 0 11px 2px rgba(34,211,238,.7);
}
.bb-pt.hi{
  background:#FBBF24;
  box-shadow:0 0 0 2px #0A0F1A, 0 0 0 3px rgba(251,191,36,.55), 0 0 11px 2px rgba(251,191,36,.75);
}
.bb-ft{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;margin-top:5px;font-size:10px;color:var(--tx3);font-variant-numeric:tabular-nums}
.bb-ft b{color:var(--tx2);font-weight:500}

/* 筛选 chips */
.chips{display:flex;gap:6px;margin:0 0 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;font-size:12px;padding:5px 11px;border-radius:8px;cursor:pointer;
  background:#0E1727;border:1px solid var(--line);color:var(--tx2);white-space:nowrap;
}
.chip:active{transform:scale(.97)}
.chip.on{background:#08202A;border-color:#123F4A;color:var(--acc)}
.chip i{font-style:normal;color:var(--tx3);margin-left:4px;font-variant-numeric:tabular-nums}
.chip.on i{color:#4E9CB8}

/* 四象限交叉 */
.quad{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;background:var(--panel)}
.quad.q1{border-color:#12404F;background:linear-gradient(180deg,#07202A,#121A2B 72%)}
.quad.q2{border-color:#4A3A08;background:linear-gradient(180deg,#1A1403,#121A2B 72%)}
.quad.q3{border-color:#1E2A3F}
.quad.q4{border-color:#1A2439;opacity:.75}
.q-hd{display:flex;align-items:baseline;gap:7px;margin-bottom:8px}
.q-hd b{font-size:13px;font-weight:600}
.q-hd u{text-decoration:none;font-size:10.5px;color:var(--tx3);margin-left:auto}
.quad.q1 .q-hd b{color:var(--acc)}
.quad.q2 .q-hd b{color:var(--gold)}
.q-ls{display:flex;flex-wrap:wrap;gap:6px}
.q-i{
  flex:0 0 auto;
  font-size:11.5px;padding:4px 8px;border-radius:7px;line-height:1.45;
  background:#0E1727;border:1px solid var(--line);color:var(--tx2);white-space:nowrap;
}
.q-i i{font-style:normal;color:var(--acc);font-variant-numeric:tabular-nums;margin-left:3px}
.q-i em{font-style:normal;color:var(--tx3);font-variant-numeric:tabular-nums;margin-left:4px}
.q-i em.lo{color:#5FC8DC}
.q-i em.hi{color:#D3A93C}
.q-none{font-size:11.5px;color:var(--tx3)}

/* 矩阵页「布林」列配色：低位青、高位金、横盘灰 */
td.blv-brk-lo,td.blv-lo{color:#5FC8DC}
td.blv-brk-hi,td.blv-hi{color:#D3A93C}
td.blv-flat{color:#6B7D99}

/* 矩阵表 */
.tbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid #1A2439;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--panel2);color:var(--tx2);font-weight:500;font-size:11px;z-index:2}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:none}
td.hit1{background:#0C1E28;color:#7FD8E8}
td.hit2{background:#0E2A36;color:#9FE8F5}
td.hit3{background:#14323F;color:#C4F3FB;font-weight:600}
tbody tr:active{background:#16213A}
.mtx-nm{font-size:12.5px;color:var(--tx)}

/* 通用块 */
.sect{font-size:12px;color:var(--tx3);margin:16px 0 8px;letter-spacing:.5px}
.sect:first-child{margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.kv span:first-child{color:var(--tx2)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
input,select{
  font-family:inherit;font-size:13px;color:var(--tx);background:#0E1727;
  border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;
}
input:focus,select:focus{outline:none;border-color:var(--acc)}
label.fl{display:block;font-size:11px;color:var(--tx3);margin:9px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

nav.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;background:rgba(14,22,38,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
nav.tabbar button{
  flex:1;background:none;border:none;border-radius:0;padding:9px 0 10px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10px;color:var(--tx3);min-width:0;
}
nav.tabbar button.on{color:var(--acc)}
nav.tabbar .ic{font-size:14px;line-height:1;font-variant-numeric:tabular-nums}

/* ---------- 自选区 ---------- */
.wcard{position:relative}
.wbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin:-6px 0 12px;padding:0 2px;
}
.wtip{
  font-size:10px;color:var(--tx3);border:1px solid var(--line);
  border-radius:20px;padding:2px 8px;white-space:nowrap;
}
.wnote{
  font-size:10px;color:var(--gold);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.wgrow{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.wgrow .mini{padding:3px 9px;font-size:10px}
.mini.danger{color:#F09595;border-color:#5A2A2A}
.walt{
  color:var(--acc);text-decoration:none;border-bottom:1px dashed var(--acc);
  margin-right:8px;cursor:pointer;
}

#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);
  background:#1B2740;color:var(--tx);border:1px solid var(--line);
  padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:99;max-width:80vw;text-align:center;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--tx3);font-size:13px;padding:34px 0;line-height:1.9}
.hr{height:1px;background:var(--line);margin:11px 0}
.tiny{font-size:11px;color:var(--tx3);line-height:1.6}
.rowbtn{display:flex;gap:8px;margin-top:10px}
.rowbtn button{flex:1}
.edt{display:grid;grid-template-columns:1.4fr 1fr .9fr .9fr 40px;gap:6px;align-items:center;margin-bottom:6px}
.edt input{font-size:12px;padding:6px}
.del{background:#2A1215;border-color:#4A1B1B;color:#F09595;padding:6px 0;text-align:center}

/* 桌面端：收成居中手机框，避免卡片被拉成超宽 */
@media (min-width:640px){
  html{background:#05080F}
  body{max-width:560px;margin:0 auto;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  nav.tabbar{max-width:560px;left:50%;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line)}
  #toast{max-width:440px}
}
</style>
</head>
<body>

<header class="hd">
  <div class="hd-main">
    <div class="hd-title">红利买点工作台</div>
    <div class="hd-sub" id="hdSub">行情实时抓取 · 持仓只存这台设备</div>
    <div class="hd-src" id="hdSrc">行情 腾讯财经 qt.gtimg.cn · 分红 东方财富 RPT_SHAREBONUS_DET</div>
  </div>
  <button id="btnRefresh" class="primary">刷新行情</button>
</header>

<div class="banner hide" id="banner"></div>
<div class="banner hide" id="banner2"></div>
<div class="banner hide" id="banner3"></div>

<main>
  <section class="view on" data-view="buy" id="v-buy"></section>
  <section class="view" data-view="watch" id="v-watch"></section>
  <section class="view" data-view="ind" id="v-ind"></section>
  <section class="view" data-view="matrix" id="v-matrix"></section>
  <section class="view" data-view="hold" id="v-hold"></section>
  <section class="view" data-view="sim" id="v-sim"></section>
  <section class="view" data-view="data" id="v-data"></section>
</main>

<nav class="tabbar">
  <button data-tab="buy" class="on"><span class="ic">◎</span>买点</button>
  <button data-tab="watch"><span class="ic">★</span>自选</button>
  <button data-tab="ind"><span class="ic">☰</span>行业</button>
  <button data-tab="matrix"><span class="ic">▦</span>矩阵</button>
  <button data-tab="hold"><span class="ic">◈</span>持仓</button>
  <button data-tab="sim"><span class="ic">↗</span>推演</button>
  <button data-tab="data"><span class="ic">⚙</span>数据</button>
</nav>

<div id="toast"></div>

<script>
"use strict";

/* ============ 基础常量 ============ */
/* A 股股息红利所得按「持股期限」差别化扣税：持股 ≤1 个月 20%、1 个月～1 年 10%、>1 年免征。
   港股通 H 股 20%、非 H 股（红筹）28%、香港账户直接持有 10%。
   注意：A 股实际是「派息时全额发放、卖出时按持股期限补扣」，
   所以这里的税后分红是「按该期限一直持有」的口径，不是到账当天的现金。 */
var TAX = { A:0, A_1Y:0.10, A_1M:0.20, HKH:0.20, HKNH:0.28, HK:0.10 };
var TAX_NAME = {
  A:"A股·满1年免征", A_1Y:"A股·1月~1年 10%", A_1M:"A股·<1月 20%",
  HKH:"港通H·20%", HKNH:"港通非H·28%", HK:"港户·10%"
};
/* 持股期限分档：买入日期 → 该档税率（A 股专用，港股不受影响） */
var HOLD_1M_DAYS = 30;
var HOLD_1Y_DAYS = 365;
function holdDays(buyDate) {
  if (!buyDate) return null;
  var t = new Date(buyDate + "T00:00:00").getTime();
  if (isNaN(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
}
/* 该标的一次性口径用哪个税率档。A 股看持仓里录的买入日期；
   没录日期 → 按「满 1 年免征」算（保守假设长期持有），并在界面上标「按满1年计」。
   港股恒按标的自身的税档，与持有期限无关。 */
function taxKeyOf(s, hold) {
  if (!isAShare(s)) return s.tax;
  hold = hold || (state.holdings && state.holdings[s.code]);
  var d = hold ? holdDays(hold.buy) : null;
  if (d === null) return "A";             /* 未录买入日期：按满 1 年 */
  if (d < HOLD_1M_DAYS) return "A_1M";
  if (d < HOLD_1Y_DAYS) return "A_1Y";
  return "A";
}
function taxRate(s, hold) { return TAX[taxKeyOf(s, hold)] || 0; }
/* 是否「按满 1 年」兜底的 A 股（界面提示用） */
function taxAssumed(s, hold) {
  if (!isAShare(s)) return false;
  hold = hold || (state.holdings && state.holdings[s.code]);
  return !hold || !hold.buy;
}

function loadState() {
  if (!LS_OK) return null;
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    var o = JSON.parse(raw);
    if (!o || !o.stocks || !o.stocks.length) return null;
    if (typeof o.fx !== "number") o.fx = 0.92;
    if (typeof o.alertYield !== "number") o.alertYield = 5;
    if (!o.prices) o.prices = {};
    if (!o.holdings) o.holdings = {};
    if (!o.srcLog || typeof o.srcLog !== "object") o.srcLog = {};
    if (!o.indCur) o.indCur = "all";
    if (!o.buyFilter) o.buyFilter = "all";
    if (!o.mtxMode) o.mtxMode = "matrix";
    if (!o.watchSort) o.watchSort = "add";
    if (!o.boll || typeof o.boll !== "object") o.boll = { key:"", ts:null, map:{} };
    if (!o.boll.map || typeof o.boll.map !== "object") o.boll.map = {};
    /* v1 → v2：新增自选区。老用户第一次升级时把 DEFAULT_WATCH 灌进去，
       之后就以他自己的增删为准（不能每次打开都覆盖，否则删掉的又回来了） */
    if (o.v === undefined || o.v < 2) {
      if (!Array.isArray(o.watch)) o.watch = watchDefault();
      o.v = 2;
    }
    if (!Array.isArray(o.watch)) o.watch = [];
    /* DEFAULT_WATCH 增量合并（每次加载都跑，不限版本号）。
       用 state.watchSeed 记住「上一次同步时种子清单里有哪些代码」：
         · 当前种子有、上次种子没有 → 这是**本次新加的股票**，补进用户清单
         · 当前种子有、上次种子也有   → 早就存在了，用户若删过就尊重删除，不补
         · 用户自己加的（不在种子里） → 一律保留
       这样：往 DEFAULT_WATCH 加新股票，老用户下次打开就能看到；
       而用户删过的股票（哪怕还在种子里）不会反复冒出来；
       用户清空后也不会被重新灌满。 */
    (function () {
      var seedsNow = watchDefault();
      var seeded = Array.isArray(o.watchSeed) ? o.watchSeed : null;
      if (seeded === null) {
        seeded = [];              /* 从没同步过：视为"上次一个都没有" */
      }
      var seen0 = {};             /* 上次种子集合 */
      for (var sk = 0; sk < seeded.length; sk++) seen0[seeded[sk]] = 1;
      var have = {};              /* 用户当前清单 */
      for (var wi0 = 0; wi0 < o.watch.length; wi0++) have[o.watch[wi0].code] = 1;

      for (var sj = 0; sj < seedsNow.length; sj++) {
        var c0 = seedsNow[sj].code;
        /* 只有「本次种子新增」的才补；老种子已同步过，删了就删了 */
        if (!seen0[c0] && !have[c0]) o.watch.push(seedsNow[sj]);
      }
      /* 记下本次种子集合（含用户已删的，避免下次又判成"新增"） */
      o.watchSeed = [];
      for (var dk = 0; dk < seedsNow.length; dk++) o.watchSeed.push(seedsNow[dk].code);
      o.v = 3;
    })();
    return o;
  } catch (e) { return null; }
}

function saveState() {
  if (!LS_OK) return;
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {
    toast("存储失败，请用「导出备份」保底");
  }
}

state = loadState() || buildState();

/* ============ 工具 ============ */
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove("on"); }, 2200);
}

function fmt(n, d) {
  if (n === null || n === undefined || isNaN(n) || !isFinite(n)) return "--";
  return n.toFixed(d === undefined ? 2 : d);
}

function pct(n, d) {
  if (n === null || n === undefined || isNaN(n)) return "--";
  return n.toFixed(d === undefined ? 2 : d) + "%";
}

function isHK(s) { return s.market === "hk"; }
function isAShare(s) { return s.market !== "hk"; }

function qcode(s) {
  if (s.market === "hk") return "hk" + s.code;
  return (s.market === "sh" ? "sh" : "sz") + s.code;
}

/* 原币现价（A股人民币 / 港股港元） */
function priceRaw(s) {
  var q = state.prices[s.code];
  if (!q || !q.p) return null;
  return q.p;
}
/* 人民币现价（仅用于市值与跨市比较） */
function priceCNY(s) {
  var p = priceRaw(s);
  if (p === null) return null;
  return isHK(s) ? p * state.fx : p;
}
/* 人民币每股分红（税前） */
function dpsCNY(s) {
  return isHK(s) ? s.dps * state.fx : s.dps;
}
function curSym(s) { return isHK(s) ? "HK$" : "¥"; }
function curDec(s) { return isHK(s) ? 3 : 2; }

/* 税后分红收益率 —— 分红与股价同币种，汇率自然约掉。
   A 股按持仓里录的买入日期定税率档（未录 = 按满 1 年免征）。 */
function yieldNet(s) {
  var p = priceRaw(s);
  if (!p) return null;
  return s.dps * (1 - taxRate(s)) / p * 100;
}
/* 目标股息率对应买点价（原币，便于直接对照券商下单） */
function buyPrice(s, t) {
  return s.dps * (1 - taxRate(s)) / (t / 100);
}
/* 已达最高档位 */
function reachedTier(s) {
  var p = priceRaw(s);
  if (p === null) return null;
  var hit = null;
  for (var i = 0; i < TARGETS.length; i++) {
    if (p <= buyPrice(s, TARGETS[i])) hit = TARGETS[i];
  }
  return hit;
}
/* 下一档（更低的买点价） */
function nextTier(s) {
  var p = priceRaw(s);
  if (p === null) return null;
  for (var i = 0; i < TARGETS.length; i++) {
    if (p > buyPrice(s, TARGETS[i])) return TARGETS[i];
  }
  return null;
}

/* ============ 行情抓取 ============ */
var fetching = false;

function fetchQuotes(codes, cb) {
  if (!codes.length) { cb(true); return; }
  var done = 0, total = codes.length;
  function one(code) {
    var sc = document.createElement("script");
    sc.charset = "gbk";
    sc.src = "https://qt.gtimg.cn/q=" + code + "&_=" + Date.now();
    var settled = false;
    function fin() {
      if (settled) return;
      settled = true;
      sc.remove();
      done++;
      if (done >= total) cb(true);
    }
    sc.onload = fin;
    sc.onerror = fin;
    setTimeout(fin, 6000);
    document.head.appendChild(sc);
  }
  for (var i = 0; i < codes.length; i++) one(codes[i]);
}

function refreshAll() {
  if (fetching) return;
  fetching = true;
  var btn = document.getElementById("btnRefresh");
  btn.textContent = "抓取中…";
  btn.disabled = true;

  /* 抓价清单 = 池子 + 自选（自选里池外的也要抓，去重）
     同一轮抓完，自选股就能和池内股共享价格与时间戳 */
  var list = state.stocks.slice();
  var seen = {};
  for (var si = 0; si < list.length; si++) seen[list[si].code] = 1;
  for (var wi = 0; wi < state.watch.length; wi++) {
    var w = state.watch[wi];
    if (!seen[w.code]) { seen[w.code] = 1; list.push(w); }
  }
  var idx = 0, got = 0, CHUNK = 12;

  /* 手机首屏先显示「正在抓取」，避免误以为看的是死数据 */
  var hd0 = document.getElementById("hdSub");
  if (hd0) hd0.innerHTML = '<span style="color:var(--gold)">正在抓取行情…</span> 共 ' + list.length + ' 只，稍候';

  function nextChunk() {
    if (idx >= list.length) {
      fetching = false;
      btn.textContent = "刷新行情";
      btn.disabled = false;
      if (got > 0) state.updatedAt = new Date().toISOString();
      if (!state.srcLog) state.srcLog = {};
      var prevQ = state.srcLog.quote || {};
      state.srcLog.quote = {
        ts: got > 0 ? new Date().toISOString() : (prevQ.ts || null),   /* 最后一次成功 */
        try: new Date().toISOString(),                                  /* 最后一次尝试 */
        got: got, total: list.length
      };
      saveState();
      renderAll();
      updateFresh();
      checkDividend(false);
      fetchBoll(false);   /* 行情到位后再补布林，避免首屏被上百个请求拖住 */
      toast(got > 0 ? ("已更新 " + got + " 只行情") : "没抓到行情，请手动填价");
      return;
    }
    var chunk = list.slice(idx, idx + CHUNK);
    idx += CHUNK;
    var codes = chunk.map(qcode);
    fetchQuotes(codes, function() {
      for (var i = 0; i < chunk.length; i++) {
        var s = chunk[i];
        var g = window["v_" + qcode(s)];
        if (typeof g === "string" && g.length > 20) {
          var a = g.split("~");
          var cur = parseFloat(a[3]);
          if (cur > 0) {
            state.prices[s.code] = {
              p: cur,
              prev: parseFloat(a[4]) || null,
              t: a[30] || "",
              at: Date.now()
            };
            got++;
          }
        }
      }
      setTimeout(nextChunk, 120);
    });
  }
  nextChunk();
}

/* ============ 布林通道 BOLL(20,2) ============
   口径：日线「前复权」收盘价、20 日周期、±2 倍「总体」标准差（与通达信 / 同花顺一致）。
   三轨由「到计算日为止的最后 20 根收盘」算出，一天一算，缓存在 state.boll。
   前复权是必须的：红利股除权日会跳空，不复权会造出「假跌破下轨」。 */

function dayKey(d) {
  d = d || new Date();
  return "" + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate());
}

/* 东财 secid：沪市 1. / 深市 0. / 港股 116. */
function secidOf(s) {
  if (s.market === "hk") return "116." + s.code;
  return (s.market === "sh" ? "1." : "0.") + s.code;
}

/* 由收盘价序列算三轨，取最后 P 根；不足 P 根返回 null（新股不给编造） */
function bollStat(closes) {
  if (!closes || closes.length < BOLL_P) return null;
  var arr = closes.slice(closes.length - BOLL_P);
  var n = arr.length, i, sum = 0;
  for (i = 0; i < n; i++) sum += arr[i];
  var mid = sum / n, sq = 0;
  for (i = 0; i < n; i++) sq += (arr[i] - mid) * (arr[i] - mid);
  var sd = Math.sqrt(sq / n);   /* 总体标准差，不是样本标准差 */
  return { mid:mid, up:mid + BOLL_K * sd, lo:mid - BOLL_K * sd, sd:sd };
}

/* 一只股票的布林位置 + 现价到三轨的距离 */
function bollOf(s) {
  var b = (state.boll && state.boll.map) ? state.boll.map[s.code] : null;
  if (!b || !(b.up > b.lo)) return null;
  var p = priceRaw(s);
  if (p === null || p <= 0) return null;
  var span = b.up - b.lo;
  var pos = span > 0 ? (p - b.lo) / span * 100 : 50;
  var bw = b.mid > 0 ? span / b.mid * 100 : 0;
  var lv;
  if (bw < BOLL_MIN_BW) lv = "flat";
  else if (pos < 0)      lv = "brk-lo";
  else if (pos < 15)     lv = "lo";
  else if (pos < 40)     lv = "dn";
  else if (pos <= 60)    lv = "mid";
  else if (pos <= 85)    lv = "up";
  else if (pos <= 100)   lv = "hi";
  else                   lv = "brk-hi";
  return {
    lo:b.lo, mid:b.mid, up:b.up, pos:pos, bw:bw, lv:lv, d:b.d || "", n:b.n || 0,
    dLo:(p / b.lo - 1) * 100, dMid:(p / b.mid - 1) * 100, dUp:(p / b.up - 1) * 100
  };
}

/* 现价离哪根轨最近 —— 提醒里显示的就是这个距离 */
function bollNear(bb) {
  if (bb.lv === "brk-lo" || bb.lv === "lo") return { t:"下轨", v:bb.dLo };
  if (bb.lv === "brk-hi" || bb.lv === "hi") return { t:"上轨", v:bb.dUp };
  return { t:"中轨", v:bb.dMid };
}

/* 全池布林分布 */
function bollCount() {
  var c = { "brk-lo":0, lo:0, dn:0, mid:0, up:0, hi:0, "brk-hi":0, flat:0, none:0, n:0 };
  for (var i = 0; i < state.stocks.length; i++) {
    var bb = bollOf(state.stocks[i]);
    if (!bb) { c.none++; continue; }
    c[bb.lv]++;
    c.n++;
  }
  c.tight = c["brk-lo"] + c.lo;    /* 贴下轨（含跌破） */
  c.rich  = c["brk-hi"] + c.hi;    /* 贴上轨（含突破） */
  return c;
}

/* ============ 通用：单只股票卡片 ============
   opt.rank -> 在名称前显示序号（行业页用来标「行业内第几便宜」） */
function stockCardHTML(s, y, opt) {
  opt = opt || {};
  var q = state.prices[s.code];
  var p = priceRaw(s);
  var tier = reachedTier(s);
  var nt = nextTier(s);
  var cls = "";
  if (tier !== null && tier >= 6) cls = " hot";
  else if (tier !== null) cls = " hit";

  var h = '<div class="stk' + cls + '">';
  h += '<div class="stk-top">';
  if (opt.rank) h += '<span class="rk">' + opt.rank + '</span>';
  h += '<span class="nm">' + esc(s.name) + '</span>';
  h += '<span class="cd">' + s.code + '</span>';
  /* 税率标签显示「本次实际生效的那一档」，而不是标的自身字段——
     否则持有不满 1 年时界面写「免税」、算的却是 10%，自相矛盾 */
  var tk = taxKeyOf(s), tAssumed = taxAssumed(s);
  h += '<span class="tag ' + (tk === "A" && tAssumed ? 'a assumed' : (isHK(s) ? 'hk' : 'a')) + '"'
     + ' title="' + (isHK(s) ? esc(TAX_NAME[tk]) : (tAssumed ? '未录买入日期，按「持股满 1 年免征」计；录了日期会自动按实际期限分档' : esc(TAX_NAME[tk]))) + '">'
     + TAX_NAME[tk] + (tAssumed ? '*' : '') + '</span>';
  var hd0 = state.holdings[s.code];
  h += '<span class="gobtn" data-hold="' + s.code + '">'
     + (hd0 && hd0.qty ? (hd0.qty + '股 ›') : '仓位 ›') + '</span>';
  h += '<span class="sec">' + esc(s.sector) + '</span>';
  h += '</div>';

  h += '<div class="stk-mid">';
  if (p !== null) {
    var chg = "";
    if (q && q.prev) {
      var d = (q.p - q.prev) / q.prev * 100;
      chg = '<span class="chg ' + (d > 0 ? "up" : (d < 0 ? "down" : "flat")) + '">'
          + (d > 0 ? "+" : "") + d.toFixed(2) + '%</span>';
    }
    h += '<div><span class="px">' + (isHK(s) ? "HK$" : "¥") + fmt(q.p, isHK(s) ? 3 : 2) + '</span>' + chg + '</div>';
  } else {
    h += '<div><span class="px" style="color:#5C7093">--</span></div>';
  }
  h += '<div class="yld"><div class="yld-v"' + (y >= state.alertYield ? ' style="color:#FBBF24"' : '') + '>'
     + (y === -999 ? "--" : pct(y)) + '</div><div class="yld-l">税后股息率</div></div>';
  h += '</div>';

  h += '<div class="stk-bot">';
  h += '<span class="pill">每股分红 <b>' + (isHK(s) ? "HK$" : "¥") + fmt(s.dps, 3) + '</b></span>';
  if (tier !== null) {
    h += '<span class="pill ' + (tier >= 6 ? "gold" : "acc") + '">已达 <b>' + tier + '%</b> 档</span>';
  }
  if (nt !== null && p !== null) {
    var need = buyPrice(s, nt);
    var drop = (need / p - 1) * 100;
    h += '<span class="pill">到 ' + nt + '% 买点 <b>' + curSym(s) + fmt(need, curDec(s)) + '</b>（' + drop.toFixed(1) + '%）</span>';
  }
  if (tier !== null && p !== null) {
    h += '<span class="pill">现价距本档 <b>' + ((p / buyPrice(s, tier) - 1) * 100).toFixed(1) + '%</b></span>';
  }
  h += '</div>';

  /* ---- 布林轨道尺：位置条 + 三轨价 + 到最近轨的距离 ---- */
  var bb = bollOf(s);
  if (bb) {
    var nr = bollNear(bb);
    var pc = Math.max(0, Math.min(100, bb.pos));
    var ptCls = (bb.lv === "brk-lo" || bb.lv === "lo") ? " lo"
              : ((bb.lv === "brk-hi" || bb.lv === "hi") ? " hi" : "");
    var nrC = nr.v < 0 ? "#F09595" : "var(--tx3)";
    h += '<div class="bb">';
    h += '<div class="bb-hd">';
    h += '<span class="bb-tag bb-' + bb.lv + '">' + BOLL_NAME[bb.lv] + '</span>';
    h += '<span class="bb-dist">距' + nr.t + ' <b style="color:' + nrC + '">'
       + (nr.v > 0 ? "+" : "") + nr.v.toFixed(1) + '%</b>'
       + '<span style="color:#3E4E66"> · </span>位置 ' + bb.pos.toFixed(0) + '%</span>';
    h += '</div>';
    h += '<div class="bb-track">';
    h += '<span class="bb-tk" style="left:0"></span>'
       + '<span class="bb-tk mid" style="left:50%"></span>'
       + '<span class="bb-tk" style="left:100%"></span>';
    h += '<span class="bb-pt' + ptCls + '" style="left:' + pc.toFixed(1) + '%"></span>';
    h += '</div>';
    h += '<div class="bb-ft">'
       + '<span>下 <b>' + fmt(bb.lo, curDec(s)) + '</b></span>'
       + '<span>中 <b>' + fmt(bb.mid, curDec(s)) + '</b></span>'
       + '<span>上 <b>' + fmt(bb.up, curDec(s)) + '</b></span>'
       + '<span style="color:#3E4E66">带宽 ' + bb.bw.toFixed(1) + '%</span>'
       + '</div>';
    h += '</div>';
  } else if (state.boll && state.boll.key) {
    /* 有布林缓存但这只没算出来：没价格、新股、停牌、或 K 线不足 20 日——如实标注不硬凑 */
    var why = (priceRaw(s) === null) ? "待价格，刷新后显示轨道"
                                    : ("K 线不足 " + BOLL_P + " 日或本次抓取失败");
    h += '<div class="bb"><div class="bb-hd">'
       + '<span class="bb-tag bb-flat">无布林数据</span>'
       + '<span class="bb-dist">' + why + '</span></div></div>';
  }

  h += '</div>';
  return h;
}

/* ============ 渲染：买点榜 ============ */
function renderBuy() {
  var el = document.getElementById("v-buy");
  var rows = [];
  for (var i = 0; i < state.stocks.length; i++) {
    var s = state.stocks[i];
    var y = yieldNet(s);
    rows.push({ s:s, y:(y === null ? -999 : y) });
  }
  rows.sort(function(a, b){ return b.y - a.y; });

  var noPrice = 0, hot = 0;
  for (var k = 0; k < rows.length; k++) {
    if (rows[k].y === -999) noPrice++;
    if (rows[k].y >= state.alertYield) hot++;
  }

  var bc = bollCount();
  var h = "";

  /* ---- 布林筛选条（有布林数据才出现）---- */
  if (bc.n > 0) {
    if (state.buyFilter !== "lo" && state.buyFilter !== "hi") state.buyFilter = "all";
    h += '<div class="chips">';
    h += '<span class="chip' + (state.buyFilter === "all" ? " on" : "") + '" data-bf="all">全部<i>' + state.stocks.length + '</i></span>';
    h += '<span class="chip' + (state.buyFilter === "lo" ? " on" : "") + '" data-bf="lo">贴下轨<i>' + bc.tight + '</i></span>';
    h += '<span class="chip' + (state.buyFilter === "hi" ? " on" : "") + '" data-bf="hi">贴上轨<i>' + bc.rich + '</i></span>';
    h += '</div>';
  }

  var shown = rows, filtering = false;
  if (state.buyFilter === "lo" || state.buyFilter === "hi") {
    filtering = true;
    shown = [];
    for (var m = 0; m < rows.length; m++) {
      var bb = bollOf(rows[m].s);
      if (!bb) continue;
      var isLo = (bb.lv === "brk-lo" || bb.lv === "lo");
      var isHi = (bb.lv === "brk-hi" || bb.lv === "hi");
      if (state.buyFilter === "lo" ? isLo : isHi) shown.push(rows[m]);
    }
  }

  h += '<div class="sect">'
     + (filtering
        ? '布林' + (state.buyFilter === "lo" ? '贴下轨' : '贴上轨') + ' · 筛出 ' + shown.length + ' / ' + state.stocks.length + ' 只'
        : '按税后股息率排序 · 共 ' + state.stocks.length + ' 只'
          + (hot ? ' · 其中 ' + hot + ' 只已达 ' + state.alertYield + '% 关注线' : ''))
     + '</div>';

  if (filtering && !shown.length) {
    h += '<div class="empty">当前没有符合「' + (state.buyFilter === "lo" ? '贴下轨' : '贴上轨')
       + '」的标的<br><span class="tiny">点上方「全部」回到完整列表</span></div>';
    el.innerHTML = h;
    return;
  }

  if (noPrice > 0 && !filtering) {
    h += '<div class="banner" style="margin:0 0 10px">有 ' + noPrice
       + ' 只还没有价格。点右上角「刷新行情」，或去「数据」页手动填现价。</div>';
  }

  for (var j = 0; j < shown.length; j++) {
    h += stockCardHTML(shown[j].s, shown[j].y, {});
  }
  el.innerHTML = h;
}

/* ============ 渲染：分行业观察 ============ */
function medOf(arr) {
  if (!arr.length) return null;
  var a = arr.slice().sort(function(x, y){ return x - y; });
  var m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}

/* 一个行业的汇总水位 */
function groupStat(g) {
  var list = stocksOf(g);
  var ys = [], chgs = [], hot = 0, held = 0, noPx = 0;
  for (var i = 0; i < list.length; i++) {
    var s = list[i];
    var y = yieldNet(s);
    if (y === null) noPx++;
    else {
      ys.push(y);
      if (y >= state.alertYield) hot++;
    }
    var q = state.prices[s.code];
    if (q && q.prev) chgs.push((q.p - q.prev) / q.prev * 100);
    var hd = state.holdings[s.code];
    if (hd && hd.qty) held++;
  }
  ys.sort(function(a, b){ return a - b; });
  var sum = 0;
  for (var k = 0; k < chgs.length; k++) sum += chgs[k];
  return {
    n: list.length, noPx: noPx, hot: hot, held: held,
    med: medOf(ys),
    max: ys.length ? ys[ys.length - 1] : null,
    min: ys.length ? ys[0] : null,
    avgChg: chgs.length ? sum / chgs.length : null
  };
}

function renderInd() {
  var el = document.getElementById("v-ind");
  var cur = groupByKey(state.indCur);
  var h = "";

  /* ---- 行业页签（横向滚动）---- */
  h += '<div class="indtabs">';
  for (var i = 0; i < GROUPS.length; i++) {
    var g = GROUPS[i];
    var c = stocksOf(g).length;
    h += '<div class="indtab' + (g.k === cur.k ? " on" : "") + '" data-ind="' + g.k + '">'
       + g.n + '<span class="n">' + c + '</span></div>';
  }
  h += '</div>';

  if (cur.k === "all") {
    /* ================= 全部：行业水位总览 ================= */
    var rows = [];
    for (var j = 1; j < GROUPS.length; j++) {
      var gg = GROUPS[j];
      var st = groupStat(gg);
      if (!st.n) continue;
      rows.push({ g: gg, st: st });
    }
    rows.sort(function(a, b){ return (b.st.med || 0) - (a.st.med || 0); });

    var topMed = 0;
    for (var t = 0; t < rows.length; t++) if (rows[t].st.med > topMed) topMed = rows[t].st.med;

    var allSt = groupStat(GROUPS[0]);

    h += '<div class="sect">行业水位总览 · 按行业中位税后股息率排序</div>';
    h += '<div class="card">';
    for (var r = 0; r < rows.length; r++) {
      var st2 = rows[r].st;
      var w = topMed > 0 ? (st2.med / topMed * 100) : 0;

/* 布林 × 股息率 四象限：单看布林只知道贵不贵，单看股息率只知道给多少，交叉才有意义 */
function quadHTML() {
  var q = [[], [], [], []], none = 0;
  for (var i = 0; i < state.stocks.length; i++) {
    var s = state.stocks[i];
    var y = yieldNet(s);
    var bb = bollOf(s);
    if (!bb || y === null) { none++; continue; }
    var low = bb.pos < 50;
    var hot = y >= state.alertYield;
    q[(low ? 0 : 2) + (hot ? 0 : 1)].push({ s:s, y:y, bb:bb });
  }
  for (var k = 0; k < 4; k++) q[k].sort(function(a, b){ return b.y - a.y; });

  var DEF = [
    { k:"q1", t:"便宜且高息", star:true },
    { k:"q2", t:"好公司但贵了", star:false },
    { k:"q3", t:"便宜但息不够", star:false },
    { k:"q4", t:"暂不用看", star:false }
  ];
  var CAP = [40, 20, 20, 8];

  var h = '<div class="sect">布林位置 50% 为界切「贵 / 便宜」；股息率以 ' + state.alertYield + '% 关注线为界</div>';
  for (var j = 0; j < 4; j++) {
    var d = DEF[j], list = q[j];
    h += '<div class="quad ' + d.k + '">';
    h += '<div class="q-hd"><b>' + d.t + (d.star ? ' ★' : '') + '</b><u>' + list.length + ' 只</u></div>';
    if (!list.length) {
      h += '<div class="q-none">无</div>';
    } else {
      h += '<div class="q-ls">';
      var lim = Math.min(list.length, CAP[j]);
      for (var m = 0; m < lim; m++) {
        var it = list[m];
        var pc = it.bb.pos;
        var emC = pc < 30 ? "lo" : (pc > 70 ? "hi" : "");
        h += '<span class="q-i">' + esc(it.s.name) + '<i>' + it.y.toFixed(2) + '%</i>'
           + '<em class="' + emC + '">' + pc.toFixed(0) + '%</em></span>';
      }
      if (list.length > lim) h += '<span class="q-none" style="padding:4px 0">…另有 ' + (list.length - lim) + ' 只</span>';
      h += '</div>';
    }
    h += '</div>';
  }
  if (none) h += '<div class="tiny">有 ' + none + ' 只缺价格或 K 线不足 ' + BOLL_P + ' 日，未参与分组。</div>';
  h += '<div class="tiny" style="margin-top:8px">每个标的后面：第一个百分比是税后股息率，第二个是布林位置'
     + '（0%=下轨，100%=上轨，青色偏低 / 金色偏高）。左侧两组才是值得看的，右侧两组用来确认「不是我漏了」。</div>';
  return h;
}

function renderHold() {
  var el = document.getElementById("v-hold");
  var codes = Object.keys(state.holdings);
  var list = [];
  for (var i = 0; i < codes.length; i++) {
    var hd = state.holdings[codes[i]];
    if (!hd || !hd.qty) continue;
    var s = findStock(codes[i]);
    if (!s) continue;
    list.push({ s:s, qty:hd.qty, cost:hd.cost || 0, buy:hd.buy || null, hold:hd });
  }

  if (!list.length) {
    el.innerHTML = '<div class="empty">还没有录入持仓<br>'
      + '<span class="tiny">去「买点」页，点卡片里的「记仓位」录入持股数量与成本</span></div>';
    return;
  }

  var totMv = 0, totCost = 0, totDiv = 0, noPx = 0, assumed = 0;
  var h = '<div class="sect">持仓总览</div>';
  var body = "";
  for (var j = 0; j < list.length; j++) {
    var it = list[j], s2 = it.s;
    var p = priceCNY(s2);
    var fx = isHK(s2) ? state.fx : 1;
    var mv = p === null ? null : it.qty * p;
    var cost = it.qty * it.cost * fx;
    var rate = taxRate(s2, it.hold);          /* 按持股期限取的税率 */
    var tk = taxKeyOf(s2, it.hold);
    var tAssumed = taxAssumed(s2, it.hold);
    var div = dpsCNY(s2) * (1 - rate) * it.qty;
    var cdy = it.cost > 0 ? (dpsCNY(s2) * (1 - rate) / (it.cost * fx) * 100) : null;
    if (mv !== null) totMv += mv; else noPx++;
    if (tAssumed) assumed++;
    totCost += cost;
    totDiv += div;

    body += '<div class="card">';
    body += '<div class="stk-top"><span class="nm">' + esc(s2.name) + '</span>'
         + '<span class="cd">' + s2.code + '</span>'
         + '<span class="sec">' + it.qty + ' 股</span></div>';
    body += '<div class="kv"><span>持仓市值</span><b>' + (mv === null ? "--" : "¥" + fmt(mv, 0)) + '</b></div>';
    body += '<div class="kv"><span>持仓成本</span><b>¥' + fmt(cost, 0) + '</b></div>';
    if (mv !== null && cost > 0) {
      var pl = mv - cost;
      body += '<div class="kv"><span>浮动盈亏</span><b class="' + (pl >= 0 ? "up" : "down") + '">'
           + (pl >= 0 ? "+" : "") + fmt(pl, 0) + '（' + (pl / cost * 100).toFixed(1) + '%）</b></div>';
    }
    body += '<div class="kv"><span>成本股息率 CDY</span><b>' + (cdy === null ? "--" : pct(cdy)) + '</b></div>';
    body += '<div class="kv"><span>年税后分红</span><b style="color:#FBBF24">¥' + fmt(div, 0) + '</b></div>';
    /* 税率档 + 持股天数：让「为什么是 0% 或 10%」有据可查 */
    var holdTxt = tAssumed ? '未录买入日期'
      : (function(){ var dd = holdDays(it.buy); return dd === null ? '日期有误' : ('持有 ' + dd + ' 天'); })();
    body += '<div class="kv"><span>股息税率</span><b>' + TAX_NAME[tk]
         + (tAssumed ? ' <span class="tiny">（按满1年，未录日期）</span>'
                     : ' <span class="tiny">（' + holdTxt + '）</span>') + '</b></div>';
    body += '<div class="rowbtn"><button class="mini ghost" data-hold="' + s2.code + '">修改持仓</button></div>';
    body += '</div>';
  }

  h += '<div class="card" style="border-color:#123F4A">';
  h += '<div class="kv"><span>合计市值</span><b>¥' + fmt(totMv, 0) + (noPx ? ' <span class="tiny">(' + noPx + '只无价)</span>' : '') + '</b></div>';
  h += '<div class="kv"><span>合计成本</span><b>¥' + fmt(totCost, 0) + '</b></div>';
  if (totCost > 0) {
    var tp = totMv - totCost;
    h += '<div class="kv"><span>总盈亏</span><b class="' + (tp >= 0 ? "up" : "down") + '">'
       + (tp >= 0 ? "+" : "") + fmt(tp, 0) + '（' + (totMv / totCost * 100 - 100).toFixed(1) + '%）</b></div>';
  }
  h += '<div class="kv"><span>组合成本股息率</span><b>' + (totCost > 0 ? pct(totDiv / totCost * 100) : "--") + '</b></div>';
  h += '<div class="kv"><span>年税后被动收入</span><b style="color:#FBBF24;font-size:17px">¥' + fmt(totDiv, 0) + '</b></div>';
  h += '<div class="kv"><span>月均被动收入</span><b style="color:#FBBF24">¥' + fmt(totDiv / 12, 0) + '</b></div>';
  h += '</div>';
  if (assumed) {
    h += '<div class="tiny" style="margin:6px 0 4px;color:#FBBF24">有 ' + assumed
       + ' 只 A 股未录买入日期，暂按「持股满 1 年免征」估算。<br>'
       + '持有不满 1 年会被扣 10%~20%，点「修改持仓」补上买入日期即可按实际期限重算。</div>';
  } else {
    h += '<div class="tiny" style="margin:6px 0 4px">A 股按持股期限分档计税：满 1 年免征 / 1 月~1 年 10% / 不足 1 月 20%。<br>'
       + '实际是派息时全额发放、卖出时补扣，这里算的是「按该期限一直持有」的税后口径。</div>';
  }
  h += '<div class="sect">持仓明细</div>';
  h += body;

  el.innerHTML = h;
}

/* 排序模式：add=按添加顺序 / yield=按股息率 / chg=按涨跌幅 */
function watchSorted() {
  var arr = state.watch.slice();
  var mode = state.watchSort || "add";
  if (mode === "yield") {
    arr.sort(function(a, b){ return (yieldNet(b) || -999) - (yieldNet(a) || -999); });
  } else if (mode === "chg") {
    arr.sort(function(a, b){
      var qa = state.prices[a.code], qb = state.prices[b.code];
      var da = (qa && qa.prev) ? (qa.p / qa.prev - 1) : -999;
      var db = (qb && qb.prev) ? (qb.p / qb.prev - 1) : -999;
      return db - da;
    });
  }
  return arr;
}

/* 自选股 → 一个「假 stock」对象，好让 stockCardHTML 直接吃 */

/* 自选区事件绑定 */
function bindWatch() {

/* 按输入内容加自选：纯代码直接加，中文名先查 */
function addWatchByInput(raw) {
  var m = /^\d{6}$/.test(raw) || /^\d{5}$/.test(raw);
  if (m) {
    var market = /^\d{5}$/.test(raw) ? "hk" : (/^6/.test(raw) ? "sh" : "sz");
    doAddWatch({ code: raw, name: "", market: market });
  } else {
    lookupStock(raw, true);
  }
}

/* 名称 → 代码：走东财搜索（JSONP，无需服务器） */
function lookupStock(kw, andAdd) {
  var out = document.getElementById("wLookupOut");
  if (out) out.innerHTML = '<span style="color:var(--acc)">查询中…</span>';
  var url = "https://searchapi.eastmoney.com/api/suggest/get"
          + "?input=" + encodeURIComponent(kw)
          + "&type=14&token=D43BF722C8E33BDC906FB84D85E326E8&count=12";
  jsonp(url, function (d) {
    var items = (d && d.QuotationCodeTable && d.QuotationCodeTable.Data) || [];
    var keep = { "0":"sz", "1":"sh", "116":"hk" };
    var hits = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var mk = keep[String(it.MktNum)];
      if (!mk) continue;
      hits.push({ code: it.Code, name: it.Name, market: mk, type: it.SecurityTypeName });
    }
    if (!hits.length) {
      if (out) out.innerHTML = '<span style="color:#F09595">没找到「' + esc(kw) + '」，确认一下名称或直接填 6 位代码</span>';
      return;
    }
    var exact = null;
    for (var j = 0; j < hits.length; j++) if (hits[j].name === kw) exact = hits[j];
    var pick = exact || hits[0];

    if (out) {
      var html = '找到 <b style="color:var(--acc)">' + esc(pick.name) + ' ' + pick.code + '</b>（' + esc(pick.type || pick.market) + '）';
      if (hits.length > 1) {
        html += '<br>其他候选：';
        for (var k = 0; k < Math.min(hits.length, 4); k++) {
          if (hits[k] === pick) continue;
          html += '<a href="javascript:void(0)" class="walt" data-wpick="' + hits[k].code + '|'
               + esc(hits[k].name) + '|' + hits[k].market + '">' + esc(hits[k].name) + ' ' + hits[k].code + '</a> ';
        }
      }
      out.innerHTML = html;
      var alts = out.querySelectorAll("[data-wpick]");
      for (var q = 0; q < alts.length; q++) {
        alts[q].onclick = function () {
          var p = this.getAttribute("data-wpick").split("|");
          doAddWatch({ code:p[0], name:p[1], market:p[2] }, true);
        };
      }
    }
    if (andAdd) doAddWatch({ code: pick.code, name: pick.name, market: pick.market }, true);
  }, "callback");
}

/* 真正写入自选 */
function doAddWatch(item, silent) {
  if (findWatch(item.code)) { toast("「" + (item.name || item.code) + "」已在自选区"); return; }
  var pool = watchInPool(item.code);
  state.watch.push({
    code: item.code,
    name: item.name || (pool ? pool.name : item.code),
    market: item.market,
    dps: pool ? pool.dps : 0,
    tax: pool ? pool.tax : (item.market === "hk" ? "HKNH" : "A"),
    note: "",
    addedAt: new Date().toISOString()
  });
  saveState();
  renderWatch();
  refreshWatchQuotes();
  if (!silent) {
    toast("已加入自选：" + (item.name || item.code) + (pool ? "（已带出池内分红，可去核对）" : "（记得补每股分红）"));
  }
}

/* 编辑某只自选：名称 / 每股分红 / 备注 */
function editWatch(code) {
  var w = findWatch(code);
  if (!w) return;
  var name = prompt("名称", w.name || "");
  if (name === null) return;
  var d = prompt("每股分红（" + (w.market === "hk" ? "港元" : "元") + "，可留空）", w.dps || "");
  if (d === null) return;
  var n = prompt("备注（如「等 5.5% 加」「季度看一次」，可留空）", w.note || "");
  if (n === null) return;
  w.name = (name || w.name || code).trim();
  var dv = parseFloat(d);
  if (!isNaN(dv) && dv >= 0) w.dps = dv;
  w.note = (n || "").trim();
  saveState();
  renderWatch();
  toast("已更新自选");
}

function delWatch(code) {
  var w = findWatch(code);
  if (!w) return;
  if (!confirm("把「" + (w.name || code) + "」移出自选区？\n（池子里的数据不受影响）")) return;
  var out = [];
  for (var i = 0; i < state.watch.length; i++) if (state.watch[i].code !== code) out.push(state.watch[i]);
  state.watch = out;
  saveState();
  renderWatch();
  toast("已移出自选");
}

/* 只给自选股抓价（单独一轮，不打扰主池） */
function refreshWatchQuotes() {
  if (!state.watch.length) return;
  var need = [];
  for (var i = 0; i < state.watch.length; i++) {
    var w = state.watch[i];
    if (!state.prices[w.code]) need.push(w);
  }
  if (!need.length) return;
  var codes = need.map(qcodeOf);
  fetchQuotes(codes, function () {
    var got = 0;
    for (var j = 0; j < need.length; j++) {
      var wj = need[j];
      var g = window["v_" + qcodeOf(wj)];
      if (typeof g === "string" && g.length > 20) {
        var a = g.split("~");
        var cur = parseFloat(a[3]);
        if (cur > 0) {
          state.prices[wj.code] = { p:cur, prev:parseFloat(a[4]) || null, t:a[30] || "", at:Date.now() };
          got++;
        }
      }
    }
    if (got) { saveState(); renderWatch(); }
  });
}

function renderSim() {
  var el = document.getElementById("v-sim");
  if (!state.stocks.length) { el.innerHTML = '<div class="empty">先添加标的</div>'; return; }

  var opts = "";
  for (var i = 0; i < state.stocks.length; i++) {

    var sel = (simCode === s.code) ? " selected" : "";
    opts += '<option value="' + s.code + '"' + sel + '>' + esc(s.name) + ' ' + s.code + '</option>';
  }

  var h = '<div class="sect">模拟加仓 · 看摊薄后成本与股息率</div>';
  h += '<div class="card">';
  h += '<label class="fl">标的</label><select id="simSel">' + opts + '</select>';
  h += '<div class="grid2"><div><label class="fl">加仓价（原币）</label><input id="simPx" type="number" step="0.01" inputmode="decimal"></div>';
  h += '<div><label class="fl">加仓股数</label><input id="simQty" type="number" step="100" inputmode="numeric" value="1000"></div></div>';
  h += '<div class="rowbtn"><button class="primary" id="simGo">计算</button></div>';
  h += '</div>';
  h += '<div id="simOut"></div>';
  el.innerHTML = h;

  var sel2 = document.getElementById("simSel");
  if (!simCode) simCode = state.stocks[0].code;
  sel2.value = simCode;
  var s0 = findStock(simCode);
  var p0 = s0 ? priceRaw(s0) : null;
  document.getElementById("simPx").value = p0 ? p0.toFixed(isHK(s0) ? 3 : 2) : "";

  sel2.onchange = function() {
    simCode = this.value;
    var s = findStock(simCode);

    document.getElementById("simPx").value = p ? p.toFixed(isHK(s) ? 3 : 2) : "";

  };

  doSim();
}

function doSim() {
  var out = document.getElementById("simOut");
  var s = findStock(simCode);
  if (!s) { out.innerHTML = ""; return; }
  var pxRaw = parseFloat(document.getElementById("simPx").value);
  var addQty = parseFloat(document.getElementById("simQty").value) || 0;
  var hd = state.holdings[s.code] || { qty:0, cost:0 };
  var fx = isHK(s) ? state.fx : 1;

  var h = "";
  if (!pxRaw || pxRaw <= 0 || addQty <= 0) {
    h = '<div class="card tiny">填一个加仓价和股数，这里会算出摊薄结果。</div>';
    out.innerHTML = h;
    return;
  }

  var addCost = addQty * pxRaw;
  var oldQty = hd.qty || 0;
  var oldCost = hd.cost || 0;
  var newQty = oldQty + addQty;
  var newCost = (oldQty * oldCost + addQty * pxRaw) / newQty;

  /* 加仓这一笔是「今天买入」，因此 A 股新份额按「1 月~1 年 10%」档算；
     老仓按已录的买入日期算。港股与期限无关，两笔都用同一税档。 */
  var newRate = isAShare(s) ? TAX.A_1Y : TAX[s.tax];
  var oldRate = taxRate(s, hd);
  var divPerShareNetCNY = dpsCNY(s) * (1 - newRate);
  var newCdy = divPerShareNetCNY / (newCost * fx) * 100;
  var addDiv = divPerShareNetCNY * addQty;
  var addDivMonthly = addDiv / 12;

  h += '<div class="card">';
  h += '<div class="kv"><span>加仓投入</span><b>¥' + fmt(addCost * fx, 0) + '</b></div>';
  h += '<div class="kv"><span>加仓后持股</span><b>' + newQty + ' 股</b></div>';
  h += '<div class="hr"></div>';
  if (oldQty > 0) {
    h += '<div class="kv"><span>原摊薄成本</span><b>' + (isHK(s) ? "HK$" : "¥") + fmt(oldCost, 3) + '</b></div>';
  }
  h += '<div class="kv"><span>加仓后成本</span><b>' + (isHK(s) ? "HK$" : "¥") + fmt(newCost, 3) + '</b></div>';
  if (oldQty > 0 && oldCost > 0) {
    var dlt = (newCost / oldCost - 1) * 100;
    h += '<div class="kv"><span>成本变化</span><b class="' + (dlt <= 0 ? "down" : "up") + '">'
       + (dlt > 0 ? "+" : "") + dlt.toFixed(2) + '%</b></div>';
    var oldCdy = dpsCNY(s) * (1 - oldRate) / (oldCost * fx) * 100;
    h += '<div class="kv"><span>CDY 变化</span><b>' + pct(oldCdy) + ' → <span style="color:#22D3EE">' + pct(newCdy) + '</span></b></div>';
  } else {
    h += '<div class="kv"><span>加仓后 CDY</span><b style="color:#22D3EE">' + pct(newCdy) + '</b></div>';
  }
  h += '<div class="kv"><span>新增年税后分红</span><b style="color:#FBBF24">+¥' + fmt(addDiv, 0) + '</b></div>';
  h += '<div class="kv"><span>折合每月</span><b style="color:#FBBF24">+¥' + fmt(addDivMonthly, 0) + '</b></div>';
  h += '</div>';

  h += '<div class="tiny">按该股当前每股分红与你的税率静态推算，未考虑分红未来变化与手续费。'
     + (isAShare(s) ? '加仓这一笔按「持有 1 月~1 年 10%」计（新买入份额满 1 年后免征），老仓按其买入日期对应的档位。' : '')
     + '实际以券商成交为准。</div>';
  out.innerHTML = h;
}

function bindData() {
  var fxEl = document.getElementById("setFx");
  var alEl = document.getElementById("setAlert");
  var bsEl = document.getElementById("btnSrcRefresh");
  if (bsEl) bsEl.onclick = function() { refreshAll(); };
  document.getElementById("setSave").onclick = function() {
    var v = parseFloat(fxEl.value);
    var a = parseFloat(alEl.value);
    if (v > 0 && v < 5) state.fx = v; else { toast("汇率填写有误"); return; }
    if (a > 0 && a < 30) state.alertYield = a; else { toast("关注线填写有误"); return; }
    saveState(); renderAll(); toast("设置已保存");
  };

  document.getElementById("btnDivChk").onclick = function() {
    toast("正在查询分红公告…");
    checkDividend(true);
  };

  document.getElementById("btnExport").onclick = function() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
    var a = document.createElement("a");
    var d = new Date();
    var stamp = d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) + "-" + pad2(d.getHours()) + pad2(d.getMinutes());
    a.href = URL.createObjectURL(blob);
    a.download = "红利买点备份-" + stamp + ".json";
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast("已导出备份");
  };

  var fileInp = document.getElementById("fileInp");
  document.getElementById("btnImport").onclick = function(){ fileInp.click(); };
  fileInp.onchange = function() {
    var f = this.files && this.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function() {
      try {
        var o = JSON.parse(rd.result);
        if (!o || !o.stocks || !o.stocks.length) throw new Error("bad");
        if (!confirm("将用备份覆盖当前数据（" + state.stocks.length + " 只 → " + o.stocks.length + " 只），确定吗？")) return;
        state = o;
        if (typeof state.fx !== "number") state.fx = 0.92;
        if (typeof state.alertYield !== "number") state.alertYield = 5;
        if (!state.prices) state.prices = {};
        if (!state.holdings) state.holdings = {};
        saveState(); renderAll(); toast("已恢复备份");
      } catch (e) { toast("文件格式不对，无法导入"); }
      fileInp.value = "";
    };
    rd.readAsText(f);
  };

  var edits = document.querySelectorAll("#v-data [data-f]");
  for (var i = 0; i < edits.length; i++) {
    edits[i].onchange = function() {
      var code = this.getAttribute("data-c");
      var f = this.getAttribute("data-f");
      var s = findStock(code);
      if (!s) return;
      if (f === "name") s.name = this.value;
      else if (f === "dps") { var v = parseFloat(this.value); if (v >= 0) s.dps = v; }
      else if (f === "tax") s.tax = this.value;
      else if (f === "px") {
        var p = parseFloat(this.value);
        if (p > 0) { state.prices[code] = { p:p, prev:null, t:"手动", at:Date.now() }; }
        else { delete state.prices[code]; }
      }
      saveState(); renderAll();
    };
  }

  var dels = document.querySelectorAll("#v-data [data-del]");
  for (var j = 0; j < dels.length; j++) {
    dels[j].onclick = function() {
      var code = this.getAttribute("data-del");
      var s = findStock(code);
      if (!confirm("删除「" + (s ? s.name : code) + "」？持仓记录也会一并清掉。")) return;
      state.stocks = state.stocks.filter(function(x){ return x.code !== code; });
      delete state.prices[code];
      delete state.holdings[code];
      saveState(); renderAll();
    };
  }

  document.getElementById("btnAdd").onclick = function() {
    var code = (prompt("股票代码（A股6位，港股5位如 00941）") || "").trim();
    if (!code) return;
    if (findStock(code)) { toast("已存在该标的"); return; }
    var name = (prompt("名称") || code).trim();
    var mk = "sz";
    if (/^\d{5}$/.test(code)) mk = "hk";
    else if (/^6/.test(code)) mk = "sh";
    var dpsv = parseFloat(prompt("每股分红（原币，可先填 0 后改）") || "0");
    if (isNaN(dpsv) || dpsv < 0) dpsv = 0;
    state.stocks.push({
      code:code, name:name, market:mk, sector:"其他",
      dps:dpsv, tax:(mk === "hk" ? "HKNH" : "A")
    });
    saveState(); renderAll(); toast("已新增，记得核对分红额");
  };
}

/* ============ 数据新鲜度 ============ */
var sysNotices = [];

function renderSys() {
  var el = document.getElementById("banner");
  if (!sysNotices.length) { el.classList.add("hide"); return; }
  var warn = false;
  var html = [];
  for (var i = 0; i < sysNotices.length; i++) {
    if (sysNotices[i].warn) warn = true;
    html.push(sysNotices[i].text);
  }
  el.className = "banner" + (warn ? " warn" : "");
  el.innerHTML = html.join("<br>");
}

function sysClear(tag) {
  var out = [];
  for (var i = 0; i < sysNotices.length; i++) if (sysNotices[i].tag !== tag) out.push(sysNotices[i]);
  sysNotices = out;
  renderSys();
}

function sysSet(tag, text, warn) {
  sysClear(tag);
  if (text) sysNotices.push({ tag: tag, text: text, warn: !!warn });
  renderSys();
}

/* 距上次抓价多少小时 */
function hoursSince(iso) {
  if (!iso) return Infinity;
  var t = new Date(iso).getTime();
  if (isNaN(t)) return Infinity;
  return (Date.now() - t) / 3600000;
}

/* 相对时间：刚刚 / N 分钟前 / N 小时前 / N 天前 */
function ago(iso) {
  if (!iso) return "从未";
  var t = new Date(iso).getTime();
  if (isNaN(t)) return "从未";
  var s = (Date.now() - t) / 1000;
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return Math.floor(s / 86400) + " 天前";
}

/* 绝对时间：11-02 14:07 */
function fmtTs(iso) {
  if (!iso) return "从未";
  var d = new Date(iso);
  if (isNaN(d.getTime())) return "从未";
  return pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}

/* 新鲜度分级：ok=当日 8 小时内 / old=3 天内 / stale=更旧 / none=从未 */
function freshLevel() {
  if (!state.updatedAt) return "none";
  var h = hoursSince(state.updatedAt);
  var d = new Date(state.updatedAt);
  if (d.toDateString() === new Date().toDateString() && h < 8) return "ok";
  if (h <= 72) return "old";
  return "stale";
}

/* 是否需要自动抓价：从未抓过 / 超过 4 小时 / 不是今天的 */
function needRefresh() {
  if (!state.updatedAt) return true;
  if (Object.keys(state.prices).length === 0) return true;
  if (hoursSince(state.updatedAt) > 4) return true;
  var d = new Date(state.updatedAt);
  return d.toDateString() !== new Date().toDateString();
}

/* 行情陈旧提醒 */
function updateFresh() {
  if (!state.updatedAt) {
    sysSet("fresh", "还没有抓过行情。点右上角「刷新行情」，或在「数据」页手动填价。", false);
    return;
  }
  var h = hoursSince(state.updatedAt);
  var d = new Date(state.updatedAt);
  var sameDay = d.toDateString() === new Date().toDateString();
  if (sameDay && h < 8) { sysSet("fresh", ""); return; }
  var label = (d.getMonth() + 1) + "月" + d.getDate() + "日 " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  sysSet("fresh", "行情是 " + label + " 抓的（" + ago(state.updatedAt) + "）。点右上角「刷新行情」拿最新价。", false);
}

/* ============ 分红公告监控（JSONP，无需服务器） ============ */
var divChecking = false;
var jpSeq = 0;

/* JSONP 取数。param 是回调参数名：东财 datacenter-web 用 callback，
   push2his 的 K 线接口用 cb——参数名给错会返回裸 JSON，script 静默失败，
   只能等到 15 秒超时，很难查。 */
function jsonp(url, cb, param) {
  var name = "__jp" + (++jpSeq);
  var sc = document.createElement("script");
  var settled = false;

  function done(d) {
    if (settled) return;
    settled = true;
    if (sc.parentNode) sc.parentNode.removeChild(sc);
    try { delete window[name]; } catch (e) { window[name] = undefined; }
    cb(d);
  }
  window[name] = function (d) { done(d); };
  sc.onerror = function () { done(null); };
  setTimeout(function () { done(null); }, 15000);
  sc.src = url + "&" + (param || "callback") + "=" + name;
  document.head.appendChild(sc);
}

/* 查池子内 A 股最近两个财年的分红，与内置值比对 */
function checkDividend(force) {
  if (divChecking) return;
  divChecking = true;

  /* 只需覆盖「最近一个完整财年 + 当年已公布」的范围 */
  var y0 = new Date().getFullYear() - 1;
  var flt = "(REPORT_DATE>='" + y0 + "-01-01')";
  var base = "https://datacenter-web.eastmoney.com/api/data/v1/get"
    + "?reportName=RPT_SHAREBONUS_DET"
    + "&columns=SECURITY_CODE,PRETAX_BONUS_RMB,REPORT_DATE,EX_DIVIDEND_DATE"
    + "&pageSize=500&sortColumns=REPORT_DATE&sortTypes=-1"
    + "&filter=" + encodeURIComponent(flt);

  var acc = {};      // code -> {财年: 每股分红}
  var hasAnnual = {}; // code -> {财年: true} 表示该财年有年报记录
  var plan = {};     // code -> [已公布未实施的预案]
  var totalRows = 0; // 本次抓到的原始记录数，用于判断接口是否真的通了

  /* 按「财年」归集：报告期 6-30 / 9-30 属本财年，次年 3-31(一季报) / 4-30 属上一财年。
     原按「报告期年份」累加会把 FY2026 中期算进 FY2025，导致股息率虚高。 */
  function fyOf(rd) {
    var y = parseInt(rd.slice(0, 4), 10);
    var mmdd = rd.slice(5);
    if (mmdd === "03-31" || mmdd === "04-30") return y - 1;
    return y;
  }

  function ingest(d) {
    var res = d && d.result;
    if (!res || !res.data) return 0;
    totalRows += res.data.length;
    for (var i = 0; i < res.data.length; i++) {
      var r = res.data[i];
      var code = String(r.SECURITY_CODE || "");
      var b = r.PRETAX_BONUS_RMB;
      var rd = (r.REPORT_DATE || "").slice(0, 10);
      if (!code || b === null || b === undefined || !rd) continue;
      if (!r.EX_DIVIDEND_DATE) {
        if (!plan[code]) plan[code] = [];
        plan[code].push({ rd: rd, dps: b / 10 });
        continue;
      }
      var fy = fyOf(rd);
      if (!acc[code]) acc[code] = {};
      acc[code][fy] = (acc[code][fy] || 0) + b / 10;
      /* 只有年报（12-31）才代表该财年出齐，用它判定"完整财年" */
      if (rd.slice(5) === "12-31") {
        if (!hasAnnual[code]) hasAnnual[code] = {};
        hasAnnual[code][fy] = true;
      }
    }
    return res.pages || 0;
  }

  function finished() {
    divChecking = false;
    var changes = [];
    var plans = [];

    for (var i = 0; i < state.stocks.length; i++) {
      var s = state.stocks[i];
      if (s.market === "hk") continue;
      var yrs = acc[s.code];
      var ann = hasAnnual[s.code];
      if (!yrs || !ann) continue;

      var latest = null;
      for (var k in ann) if (ann.hasOwnProperty(k)) {
        var yy = parseInt(k, 10);
        if (latest === null || yy > latest) latest = yy;
      }
      if (latest === null) continue;
      var dps = yrs[latest];
      if (!dps || dps <= 0) continue;

      var stored = parseFloat(s.dps);
      if (!stored || stored <= 0) continue;
      var dev = (dps / stored - 1) * 100;
      if (Math.abs(dev) > 5) {
        changes.push({ code: s.code, name: s.name, old: stored, neu: dps, fy: latest, dev: dev });
      }
      /* 当年新公布的预案 */
      if (plan[s.code]) {
        for (var p = 0; p < plan[s.code].length; p++) {
          var py = parseInt(plan[s.code][p].rd.slice(0, 4), 10);
          if (py > latest) plans.push({ name: s.name, fy: py, dps: plan[s.code][p].dps, rd: plan[s.code][p].rd });
        }
      }
    }

    var parts = [];
    if (changes.length) {
      var fys = [];
      for (var c0 = 0; c0 < changes.length; c0++) if (fys.indexOf(changes[c0].fy) < 0) fys.push(changes[c0].fy);
      fys.sort();
      parts.push("分红公告有变动：" + changes.length + " 只的分红额与内置值不符（按 FY"
               + fys.join("/FY") + " 已实施口径），点这里核对更新 ›");
    }
    if (plans.length) {
      parts.push("新公告：" + plans.length + " 只已公布下一年度分红预案（尚未实施），暂不计入股息率。");
    }

    var el = document.getElementById("banner2");
    if (parts.length) {
      /* 自动检查时只在有变动时打扰；手动检查则把新公告也列出来 */
      el.className = "banner info" + ((changes.length || force) ? "" : " hide");
      el.innerHTML = parts.join("<br>");
      if (changes.length) {
        el.onclick = function () { applyDiv(changes); };
      } else {
        el.onclick = null;
      }
    }     else {
      el.className = "banner hide";
    }

    /* 记录本次数据源运行情况，供「数据源」卡片展示 */
    if (!state.srcLog) state.srcLog = {};
    var prevD = state.srcLog.div || {};
    state.srcLog.div = {
      ts: totalRows > 0 ? new Date().toISOString() : (prevD.ts || null),
      try: new Date().toISOString(),
      rows: totalRows, changed: changes.length, plans: plans.length
    };
    saveState();
    updateHeader();
    var dv = document.getElementById("v-data");
    if (dv && dv.classList.contains("on")) renderData();

    if (force) toast(changes.length ? ("发现 " + changes.length + " 只分红有变动") : "分红公告已是最新");
  }

  var page = 1, guard = 0;
  function step() {
    if (++guard > 30) { finished(); return; }
    jsonp(base + "&pageNumber=" + page, function (d) {
      var pages = ingest(d);
      var got = (d && d.result && d.result.data) ? d.result.data.length : 0;
      /* 服务端固定 500 条/页，按实际返回页数与是否满页双重判断 */
      if (got > 0 && (page < pages || got >= 500)) {
        page++;
        setTimeout(step, 120);
      } else {
        finished();
      }
    });
  }
  step();
}

/* ============ 布林通道抓取（东财日 K，JSONP 免服务器） ============ */
var bollLoading = false;

/* 东财日K：klt=101 日线 / fqt=1 前复权 */
function bollURL(s) {
  return "https://push2his.eastmoney.com/api/qt/stock/kline/get"
    + "?secid=" + secidOf(s)
    + "&klt=101&fqt=1&lmt=" + BOLL_LMT + "&end=20500101"
    + "&fields1=f1&fields2=f51,f53";
}

/* 同目录若有预生成的 boll.json（收盘快照.py / GitHub Actions 产出）就优先用，
   手机端可以省掉上百个请求；没有就回落前端现场抓 */
function loadBollJSON(cb) {
  if (location.protocol.indexOf("http") !== 0 || typeof fetch !== "function") { cb(false); return; }
  var done = false;
  function fin(v) { if (!done) { done = true; cb(v); } }
  setTimeout(function () { fin(false); }, 6000);
  fetch("boll.json?t=" + Date.now()).then(function (r) {
    return r.ok ? r.json() : null;
  }).then(function (o) {
    if (o && o.key && o.map) {
      var n = 0, k0;
      for (k0 in o.map) if (o.map.hasOwnProperty(k0)) n++;
      if (n > 0) {
        /* 太旧的预生成结果不如不用：超过 10 天就作废，免得拿上个月的轨当今天用 */
        var kd = String(o.key);
        if (/^\d{8}$/.test(kd)) {
          var kt = new Date(+kd.slice(0, 4), +kd.slice(4, 6) - 1, +kd.slice(6, 8));
          if ((Date.now() - kt.getTime()) / 86400000 > 10) { fin(false); return; }
        } else { fin(false); return; }
        state.boll = { key:kd, ts:o.ts || new Date().toISOString(), map:o.map };
        if (!state.srcLog) state.srcLog = {};
        state.srcLog.boll = {
          ts: o.ts || new Date().toISOString(), try: new Date().toISOString(),
          got: n, total: state.stocks.length, from: "boll.json"
        };
        saveState();
        fin(true);
        return;
      }
    }
    fin(false);
  }).catch(function () { fin(false); });
}

/* 今天的布林是否已经算过（ts 落在今天即可，三轨一天一算） */
function bollFreshToday() {
  if (!state.boll || !state.boll.ts) return false;
  var d = new Date(state.boll.ts);
  if (isNaN(d.getTime())) return false;
  return d.toDateString() === new Date().toDateString();
}

function fetchBoll(force) {
  if (bollLoading) return;
  if (!state.boll) state.boll = { key:"", ts:null, map:{} };

  if (!force) {
    if (bollFreshToday()) { updateBollBanner(); return; }
    loadBollJSON(function (ok) {
      if (ok) { renderAll(); updateBollBanner(); return; }
      runBoll();
    });
    return;
  }
  runBoll();
}

function runBoll() {
  if (bollLoading) return;
  bollLoading = true;

  var map = {}, got = 0, done = 0;
  var CONC = 4;   /* 实测：4 并发最稳；6 并发会被东财限流掐掉近一半连接 */
  var hd = document.getElementById("hdSub");
  var total = state.stocks.length;

  function tip(txt) {
    if (hd) hd.innerHTML = '<span style="color:var(--acc)">' + txt + '</span>';
  }
  tip("正在计算布林通道… 0/" + total + "，请稍候");

  /* 一轮抓取，返回这一轮仍失败的标的 */
  function pass(list, cb) {
    if (!list.length) { cb([]); return; }
    var idx = 0, left = Math.min(CONC, list.length), failed = [];

    function worker() {
      if (idx >= list.length) { left--; if (left === 0) cb(failed); return; }
      var s = list[idx++];
      jsonp(bollURL(s), function (d) {
        var kl = (d && d.data && d.data.klines) || null;
        var ok = false;
        if (kl && kl.length) {
          var closes = [], lastD = "";
          for (var k = 0; k < kl.length; k++) {
            var a = String(kl[k]).split(",");
            var c = parseFloat(a[1]);
            if (c > 0) { closes.push(c); lastD = a[0]; }
          }
          var st = bollStat(closes);
          if (st) {
            map[s.code] = {
              lo: Math.round(st.lo * 10000) / 10000,
              mid: Math.round(st.mid * 10000) / 10000,
              up: Math.round(st.up * 10000) / 10000,
              n: closes.length, d: lastD
            };
            got++;
            ok = true;
          }
        }
        if (!ok) failed.push(s);
        done++;
        if (done % 10 === 0) tip("正在计算布林通道… " + done + "/" + total);
        setTimeout(worker, 60);
      }, "cb");
    }
    for (var w = 0; w < left; w++) worker();
  }

  function finish(failed) {
    bollLoading = false;
    if (!state.srcLog) state.srcLog = {};
    var prev = state.srcLog.boll || {};
    state.srcLog.boll = {
      ts: got > 0 ? new Date().toISOString() : (prev.ts || null),
      try: new Date().toISOString(),
      got: got, total: total, from: "live"
    };
    if (got > 0) state.boll = { key: dayKey(), ts: new Date().toISOString(), map: map };
    saveState();
    renderAll();
    updateBollBanner();
    var dv = document.getElementById("v-data");
    if (dv && dv.classList.contains("on")) renderData();
    if (got > 0) {
      toast("布林通道已更新 " + got + " 只" + (failed && failed.length ? "（" + failed.length + " 只没抓到）" : ""));
    } else {
      toast("布林通道没抓到，稍后在「数据」页点「重算布林通道」");
    }
  }

  pass(state.stocks.slice(), function (failed) {
    if (!failed.length) { finish(failed); return; }
    /* 补抓一轮：东财会随机断连，隔一秒重来通常就通了 */
    tip("补抓 " + failed.length + " 只…");
    setTimeout(function () { pass(failed, finish); }, 900);
  });
}

/* 顶部布林提醒条：只报「贴下轨 / 贴上轨」，中轨附近不打扰 */
function updateBollBanner() {
  var el = document.getElementById("banner3");
  if (!el) return;
  var c = bollCount();
  if (!c.n) { el.className = "banner hide"; el.onclick = null; el.innerHTML = ""; return; }

  var parts = [];
  if (c.tight) {
    parts.push('<span style="color:#38DEE8;font-weight:600">' + c.tight + ' 只贴下轨</span>'
      + (c["brk-lo"] ? '（' + c["brk-lo"] + ' 只已跌破）' : ''));
  }
  if (c.rich) parts.push(c.rich + ' 只贴上轨');
  if (!parts.length) { el.className = "banner hide"; el.onclick = null; el.innerHTML = ""; return; }

  var bd = (state.boll && state.boll.key) ? state.boll.key : "";
  var bdTxt = bd.length === 8 ? (bd.slice(4, 6) + "/" + bd.slice(6, 8)) : "";
  el.className = "banner info";
  el.innerHTML = '布林 ' + BOLL_P + '日 ±' + BOLL_K + 'σ'
    + (bdTxt ? '（' + bdTxt + ' 起算）' : '') + '：' + parts.join(' · ')
    + '　<b style="color:#7FC8EE">点此筛选 ›</b>';
  el.onclick = function () {
    state.buyFilter = c.tight ? "lo" : "hi";
    saveState();
    var b = document.querySelector('nav.tabbar button[data-tab="buy"]');
    if (b) { b.click(); }
    renderBuy();
    updateBollBanner();
    window.scrollTo(0, 0);
  };
}

/* 把公告值写回池子 */
function applyDiv(changes) {
  var txt = "将按交易所分红公告更新以下标的的每股分红：\n\n";
  for (var i = 0; i < changes.length; i++) {
    txt += changes[i].name + "  " + changes[i].old.toFixed(4) + " → " + changes[i].neu.toFixed(4)
      + "（FY" + changes[i].fy + "，" + (changes[i].dev > 0 ? "+" : "") + changes[i].dev.toFixed(0) + "%）\n";
  }
  txt += "\n口径：按「财年」归集各报告期「每10股派息(含税)」÷ 10，只计已实施。\n"
       + "即 FY2025 = 2025 中期 + 2025 年报（不含 2026 中期）。\n确认更新？";
  if (!confirm(txt)) return;

  var n = 0;
  for (var j = 0; j < changes.length; j++) {
    for (var k = 0; k < state.stocks.length; k++) {
      if (state.stocks[k].code === changes[j].code) {
        state.stocks[k].dps = Math.round(changes[j].neu * 10000) / 10000;
        n++;
        break;
      }
    }
  }
  saveState();
  renderAll();
  document.getElementById("banner2").className = "banner hide";
  toast("已更新 " + n + " 只分红额，全部重算完成");
}

/* ============ 启动 ============ */
(function boot() {
  if (!LS_OK) {
    sysSet("sys", "⚠ 当前浏览器禁用了本地存储，改动不会自动保存。请点「数据 → 导出 JSON」手动备份，或换 Chrome / Edge 打开。", true);
  }

  var tabs = document.querySelectorAll("nav.tabbar button");
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].onclick = function() {
      var name = this.getAttribute("data-tab");
      var views = document.querySelectorAll(".view");
      for (var j = 0; j < views.length; j++) views[j].classList.remove("on");
      document.getElementById("v-" + name).classList.add("on");
      var bs = document.querySelectorAll("nav.tabbar button");
      for (var k = 0; k < bs.length; k++) bs[k].classList.remove("on");
      this.classList.add("on");
      /* 数据页每次切过去都重渲染，保证「数据源与刷新时间」是最新的 */
      if (name === "data") { renderData(); updateHeader(); }
      if (name === "ind") renderInd();
      if (name === "watch") { renderWatch(); refreshWatchQuotes(); }
      window.scrollTo(0, 0);
    };
  }

  document.getElementById("btnRefresh").onclick = refreshAll;

  document.addEventListener("click", function(e) {
    var el = e.target;
    if (el && el.getAttribute && el.getAttribute("data-hold")) {
      editHolding(el.getAttribute("data-hold"));
      return;
    }
    if (el && el.getAttribute && el.getAttribute("data-wedit")) {
      editWatch(el.getAttribute("data-wedit"));
      return;
    }
    if (el && el.getAttribute && el.getAttribute("data-wdel")) {
      delWatch(el.getAttribute("data-wdel"));
      return;
    }
    /* 自选区排序切换 */
    var ws = (el && el.closest) ? el.closest("[data-wsort]") : null;
    if (ws) {
      state.watchSort = ws.getAttribute("data-wsort");
      saveState();
      renderWatch();
      window.scrollTo(0, 0);
      return;
    }
    /* 行业页签 / 行业总览行 */
    var ind = (el && el.closest) ? el.closest("[data-ind]") : null;
    if (ind) {
      state.indCur = ind.getAttribute("data-ind");
      saveState();
      renderInd();
      window.scrollTo(0, 0);
      return;
    }
    /* 买点页布林筛选 chips */
    var bf = (el && el.closest) ? el.closest("[data-bf]") : null;
    if (bf) {
      state.buyFilter = bf.getAttribute("data-bf");
      saveState();
      renderBuy();
      updateBollBanner();
      window.scrollTo(0, 0);
      return;
    }
    /* 矩阵页视图切换 */
    var mx = (el && el.closest) ? el.closest("[data-mtx]") : null;
    if (mx) {
      state.mtxMode = mx.getAttribute("data-mtx");
      saveState();
      renderMatrix();
      window.scrollTo(0, 0);
      return;
    }
    /* 数据页「重算布林通道」 */
    var bo = (el && el.closest) ? el.closest("[data-boll]") : null;
    if (bo) { fetchBoll(true); return; }
  });

  renderAll();
  updateFresh();
  updateBollBanner();

  if (needRefresh()) {
    setTimeout(refreshAll, 400);
  } else {
    checkDividend(false);
    /* 布林一天一算：先让首屏渲染完，再补通道数据 */
    setTimeout(function () { fetchBoll(false); }, 1500);
  }

  /* 离线兜底：只有在线打开时才注册 Service Worker（file:// 下没有 SW） */
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function() {
      navigator.serviceWorker.register("sw.js").catch(function() { /* 注册不上也不影响用 */ });
    });
  }
})();
</script>
